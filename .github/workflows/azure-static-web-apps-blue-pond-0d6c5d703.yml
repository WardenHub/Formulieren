# De actieversies staan op de huidige hoofdversie; GitHub heeft Node 20 op de runners
# afgeschaft en meldde checkout en github-script als acties die daardoor op een afwijkende
# runtime draaiden.
#
# De OIDC-stappen zijn eruit. De run meldde bij elke deploy "Unexpected input(s)
# 'github_id_token'"; die invoer bestaat niet op static-web-apps-deploy@v1 en werd dus
# genegeerd. Daarmee haalden we bij iedere deploy twee pakketten binnen en maakten we een
# token dat nergens aankwam. Het deployen zelf loopt op azure_static_web_apps_api_token.
#
# Die eerste stap deed bovendien een gewone npm install in de repositoryroot, waardoor de
# build draaide met een gewijzigde dependencyboom.

name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "staticwebapp.config.json"
      - ".github/workflows/azure-static-web-apps-blue-pond-0d6c5d703.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "staticwebapp.config.json"
      - ".github/workflows/azure-static-web-apps-blue-pond-0d6c5d703.yml"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_AAD_TENANT_ID: ${{ vars.VITE_AAD_TENANT_ID }}
          VITE_AAD_CLIENT_ID: ${{ vars.VITE_AAD_CLIENT_ID }}
          VITE_API_APP_ID: ${{ vars.VITE_API_APP_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_POND_0D6C5D703 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        with:
          app_location: "/"
          action: "close"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_POND_0D6C5D703 }}
