# De actieversies staan op de huidige hoofdversie; GitHub heeft Node 20 op de runners
# afgeschaft en meldde checkout en github-script als acties die daardoor op een afwijkende
# runtime draaiden.
#
# De OIDC-stappen blijven staan. De run meldt bij elke deploy "Unexpected input(s)
# 'github_id_token'", maar dat betekent alleen dat de invoer niet in action.yml van de v1-tag
# staat; de runner geeft hem nog steeds door als INPUT_GITHUB_ID_TOKEN en de container leest
# hem. Zonder die stappen faalde de deploy (run #195). Niet nog eens weghalen.

name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "staticwebapp.config.json"
      - ".github/workflows/azure-static-web-apps-blue-pond-0d6c5d703.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "staticwebapp.config.json"
      - ".github/workflows/azure-static-web-apps-blue-pond-0d6c5d703.yml"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v9
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_AAD_TENANT_ID: ${{ vars.VITE_AAD_TENANT_ID }}
          VITE_AAD_CLIENT_ID: ${{ vars.VITE_AAD_CLIENT_ID }}
          VITE_API_APP_ID: ${{ vars.VITE_API_APP_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_POND_0D6C5D703 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        with:
          app_location: "/"
          action: "close"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_POND_0D6C5D703 }}
