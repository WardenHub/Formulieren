# Controle voor het samenvoegen. De twee bestaande workflows bouwen en publiceren; geen
# van beide controleerde iets. Lint, tests, de architectuurvalidators en de builds liepen
# alleen op de machine van wie er net aan werkte, dus een regressie kwam pas op productie
# aan het licht.
#
# Deze workflow publiceert niets. Hij faalt alleen, en dat is precies de bedoeling.
#
# De actieversies staan op de huidige hoofdversie. GitHub heeft Node 20 op de runners
# afgeschaft; checkout@v4 en setup-node@v4 draaiden daardoor met een waarschuwing op een
# afwijkende runtime. Dat is nu nog een waarschuwing en straks een fout.

name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend en offline; lint, tests, validators, builds
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            offline/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: tests
        run: npm run test

      # De validators lezen een deel van hun bewijs buiten de repository. Zonder
      # EMBER_EXTERNAL_ARTIFACTS slaan ze dat deel over en melden dat; met
      # EMBER_EXTERNAL_STRICT zouden ze erop vallen. In CI is overslaan het juiste gedrag.
      - name: architectuurvalidators
        run: npm run validate:all

      - name: build
        run: npm run build

      # Ember Offline rendert met de runtime uit src/, via de alias @ en met de survey-core
      # van deze repository. Die koppeling breekt stil bij een refactor in de webapp, dus
      # bouwt hij hier mee; de eigen bouwbewaker van de offline app valt om zodra er weer
      # twee kopieën van survey-core in de bundel zitten. Dit hangt bewust aan dezelfde job,
      # want hij heeft de node_modules uit de root nodig die hierboven al zijn geïnstalleerd.
      - name: install offline
        working-directory: offline
        run: npm ci

      - name: build offline
        working-directory: offline
        run: npm run build

  api:
    name: API; typecheck en tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: install
        working-directory: api
        run: npm ci

      - name: typecheck
        working-directory: api
        run: npm run typecheck

      - name: tests
        working-directory: api
        run: npm run test
